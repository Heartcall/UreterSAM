<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UreterSAM · 光纤参考标注</title><link rel="stylesheet" href="/style.css"></head>
<body><header><h1>光纤尖端与全片抽样参考</h1><p>独立人工标注 · 视频仅作开发验证 · 原29帧标签只读</p></header>
<nav><select id="kind"><option value="tip">12帧尖端专项</option><option value="semantic">120帧全片分层抽样</option></select><button id="previous">上一帧</button><select id="items"></select><button id="next">下一帧</button><span id="count"></span></nav>
<main><section class="pictures"><div><h2>原始画面</h2><img id="original" alt="原始视频帧"><p id="identity"></p></div><div><h2 id="title">参考标注</h2><canvas id="canvas" width="400" height="400"></canvas><p>坐标：原始像素。灰紫色=未知；隐藏区域保留未知，不补全。</p></div></section>
<aside><p id="instructions"></p><div class="tools"><label>工具 <select id="tool"><option value="brush">画笔</option><option value="polygon">多边形</option><option value="roi">尖端评估框</option><option value="tip_point">可见末端点</option><option value="entry_point">入口点（可确认时）</option></select></label><label>标签 <select id="label"></select></label><label>画笔半径 <input id="radius" type="range" min="1" max="24" value="3"></label><button id="finish">闭合多边形</button><button id="undo">撤销</button></div>
<label><input id="showMask" type="checkbox" checked> 显示新标注</label><label><input id="showContext" type="checkbox"> 显示原29帧分割参考（仅上下文）</label><div class="tools"><button id="fillNegative">将评估框内未知区标为已确认非光纤</button><button id="clearPoints">清除框与点</button><button id="unknown">整幅重置为未知</button></div>
<div id="tipFields"><label>尖端可见性 <select id="visibility"><option value="unreviewed">未确认</option><option value="visible">可见</option><option value="partial_occlusion">部分遮挡，仍有可见末端</option><option value="occluded">尖端完全遮挡</option><option value="out_of_view">尖端在视野外</option><option value="uncertain">无法确认</option></select></label><label><input id="roiReviewed" type="checkbox"> 已检查框内尖端、杆体和负像素；无法确认的像素仍为未知</label></div>
<label id="wholeLabel"><input id="wholeReviewed" type="checkbox"> 已检查整帧的结石、可见光纤与背景；不是仅审核尖端区域</label>
<label>审核人 <input id="reviewer" type="text" placeholder="姓名或审核编号"></label><label>备注 <textarea id="note" rows="2" placeholder="反光、模糊、遮挡、与旧参考的差异"></textarea></label><label><input id="independent" type="checkbox"> 依据原图核验可见像素，未把模型预测、遮挡补全或几何外推当作真值</label>
<div class="actions"><button id="save">保存待审</button><button id="approve">确认参考</button><span id="status"></span></div><p id="message" role="status"></p><p class="hint">尖端：橙=可见尖端；青=杆体（尖端Precision中排除）；绿=确认的非光纤负像素。分层抽样：橙=结石、青=可见光纤、绿=背景。抽样由固定随机种子产生，不按模型效果挑帧。</p></aside></main><script src="/app.js"></script></body></html>
